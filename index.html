<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxdarky</title>
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #b1b1be;
            
            /* FIXED BACKGROUND: Uses a bright purple-tinted silver/grey overlay to mimic image_00d5da.jpg */
            background: linear-gradient(rgba(145, 145, 175, 0.22), rgba(20, 20, 35, 0.45)), 
                        url('https://gratisography.com/photo/black-white-trees-winter/') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* --- STICKY HIGH-CONTRAST SCANLINE OVERLAY --- */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            /* Stronger horizontal lines balancing the brighter background */
            background: linear-gradient(rgba(10, 10, 15, 0) 40%, rgba(0, 0, 0, 0.42) 50%), 
                        linear-gradient(90deg, rgba(150, 120, 255, 0.04), rgba(0, 255, 0, 0.01), rgba(100, 100, 255, 0.04));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 950px;
            margin: 0 auto;
            /* Slightly more translucent backplate so the bright background shows through your content lanes */
            background-color: rgba(11, 11, 16, 0.86);
            border: 1px solid #36364a;
            padding: 20px;
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 25px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
        }

        /* --- TYPOGRAPHY & LINKS --- */
        h1, h2, h3, h4 {
            margin: 0 0 8px 0;
            font-weight: normal;
        }

        .profile-name {
            font-family: Georgia, serif;
            font-size: 26px;
            font-style: italic;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(200, 200, 255, 0.4);
        }

        a {
            color: #9cb1e6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* --- BOXES (TABLES/PANELS) --- */
        .box {
            border: 1px solid #323244;
            margin-bottom: 20px;
            background: rgba(16, 16, 24, 0.75);
            overflow: hidden;
        }

        .box-header {
            /* Purple/Silver gradient headers matched to target scheme */
            background: linear-gradient(to bottom, #34344a, #181826);
            padding: 7px 10px;
            font-weight: bold;
            color: #e2e2ff;
            border-bottom: 1px solid #323244;
            font-size: 12px;
        }

        .box-content {
            padding: 12px;
            line-height: 1.4;
        }

        /* --- LEFT COLUMN UTILITIES --- */
        .profile-pic-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 170px;
            height: 220px;
            object-fit: cover;
            border: 1px solid #44445c;
            /* High contrast, slight purple/blue cooling filter for user portrait */
            filter: grayscale(100%) contrast(135%) brightness(95%);
            display: inline-block;
        }

        .status-text {
            text-align: center;
            margin: 8px 0;
            font-size: 11px;
            line-height: 1.5;
            color: #cbd2eb;
        }

        /* --- TWO-COLUMN STYLED TABLES (INTERESTS) --- */
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 8px;
            border: 1px solid #2d2d3b;
            vertical-align: top;
        }

        .info-table .label {
            width: 85px;
            background: rgba(40, 40, 58, 0.5);
            color: #dde2ff;
            font-weight: normal;
        }

        /* --- BLURBS & OTHER SECTIONS --- */
        .blurb-section h3 {
            font-size: 12px;
            color: #ffffff;
            margin-top: 15px;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .blurb-section h3:first-child {
            margin-top: 0;
        }

        /* Music Player Styling */
        .music-player {
            padding: 12px;
            text-align: center;
        }

        .music-player audio {
            width: 100%;
            filter: invert(0.88) hue-rotate(190deg) brightness(1.05);
            margin-top: 8px;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 12px;
        }

        .gallery-grid img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border: 1px solid #323244;
            filter: grayscale(20%) contrast(115%);
            transition: transform 0.2s;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
            border-color: #9cb1e6;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="left-col">
            <div class="profile-name">luxdarky</div>
            
            <div class="profile-pic-container">
                <img class="profile-pic" src="images/me.jpg" alt="luxdarky">
                <div class="status-text">
                    <div>Currently: Watching the Clouds :p</div>
                    <div style="margin-top: 10px; color: #00ff00; font-weight: bold;">● ONLINE/AFK</div>
                </div>
            </div>

            <div class="box">
                <div class="box-header">Contacting luxdarky</div>
                <div class="box-content">
                    <p style="margin: 0; line-height: 1.5;">
