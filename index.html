<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxdarky</title>
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #b1b1be;
            /* Style background preserved: Dark forest base with a dark tint overlay */
            background: linear-gradient(rgba(10, 14, 23, 0.75), rgba(10, 14, 23, 0.75)), 
                        url('https://gratisography.com/photo/black-white-trees-winter/') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* --- STICKY SCANLINE OVERLAY --- */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 5px, 6px 100%;
            pointer-events: none;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: rgba(13, 13, 19, 0.82);
            border: 1px solid #2d2d3b;
            padding: 20px;
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 25px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* --- TYPOGRAPHY & LINKS --- */
        h1, h2, h3, h4 {
            margin: 0;
            font-weight: normal;
        }

        .profile-name {
            font-family: Georgia, serif;
            font-size: 26px;
            font-style: italic;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        a {
            color: #8fa0cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* --- BOXES (TABLES/PANELS) --- */
        .box {
            border: 1px solid #2d2d3b;
            margin-bottom: 20px;
            background: rgba(18, 18, 26, 0.7);
            overflow: hidden;
        }

        .box-header {
            background: linear-gradient(to bottom, #2b2b3a, #151520);
            padding: 7px 10px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #2d2d3b;
            font-size: 12px;
        }

        .box-content {
            padding: 12px;
            line-height: 1.4;
        }

        /* --- LEFT COLUMN UTILITIES --- */
        .profile-pic-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 170px;
            height: 220px;
            object-fit: cover;
            border: 1px solid #3d3d4e;
            filter: grayscale(100%) contrast(140%) brightness(90%);
            display: inline-block;
        }

        .status-text {
            text-align: center;
            margin: 8px 0;
            font-size: 11px;
            line-height: 1.5;
        }

        /* --- TWO-COLUMN STYLED TABLES (INTERESTS) --- */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .info-table td {
            padding: 8px;
            border: 1px solid #2d2d3b;
            vertical-align: top;
        }

        .info-table .label {
            width: 85px;
            background: rgba(30, 30, 42, 0.6);
            color: #dde2ff;
            font-weight: normal;
        }

        /* --- RIGHT COLUMN BLURBS & PLUGINS --- */
        .blurb-section h4 {
            font-size: 12px;
            color: #ffffff;
            margin-top: 12px;
            margin-bottom: 3px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .blurb-section h4:first-child {
            margin-top: 0;
        }

        .music-player {
            padding: 12px;
            text-align: center;
        }

        .music-player audio {
            width: 100%;
            filter: invert(0.9) hue-rotate(180deg);
            margin-top: 8px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 12px;
        }

        .gallery-grid img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border: 1px solid #2d2d3b;
            filter: grayscale(30%) contrast(110%);
            transition: transform 0.2s;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
            border-color: #8fa0cc;
        }
    </style>
</head>

            </div>
